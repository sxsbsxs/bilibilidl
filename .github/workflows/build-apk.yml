name: Build bilibilidl APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilibilidl-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      P4A_USE_CERTIFI: "0"
      CYTHON_LANGUAGE_LEVEL: "3"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.parallel=false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            cmake ninja-build ccache \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 gettext

      - name: Install Buildozer and python-for-android
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          git clone --depth 1 \
            --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$RUNNER_TEMP/python-for-android"

          echo "P4A_SOURCE_DIR=$RUNNER_TEMP/python-for-android" >> "$GITHUB_ENV"

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-${{ hashFiles('buildozer.spec') }}-
            buildozer-

      - name: Check project files
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec
          test -f main.py
          test -f bili_api.py
          test -f 'downloader.py'
          test -f 'login_manager.py'
          test -f 'NotoSansCJKsc-Regular.ttf'
          test -f 'bilibilidl图标.png'
          test -f 'bilibilidl加载图.png'
          test -f src/org/bilibilidl/MediaMerger.java

          echo "Checking Python syntax..."
          python -m py_compile \
            main.py \
            bili_api.py \
            'downloader.py' \
            'login_manager.py'

          echo "Checking Java package declaration..."
          grep -n 'package org.bilibilidl;' \
            src/org/bilibilidl/MediaMerger.java

          echo "Project file checks passed."

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK/cmdline-tools"

          TMP="$(mktemp -d)"
          cd "$TMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O tools.zip

          unzip -q tools.zip
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a cmdline-tools/. "$SDK/cmdline-tools/latest/"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -f "$SDKMANAGER"

          # Legacy path used by Buildozer 1.5.0
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          yes | bash "$SDKMANAGER" \
            --sdk_root="$SDK" --licenses || true

          bash "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          test -x "$SDK/platform-tools/adb"
          test -d "$SDK/platforms/android-33"
          test -x "$SDK/build-tools/33.0.2/aidl"

      - name: Check Java MediaCodec compatibility
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("src/org/bilibilidl/MediaMerger.java")
          source = path.read_text(encoding="utf-8")

          if "package org.bilibilidl;" not in source:
              raise SystemExit(
                  "MediaMerger.java package must be org.bilibilidl"
              )

          # BufferInfo and KEY_FRAME belong to MediaCodec, not MediaMuxer.
          source = source.replace(
              "MediaMuxer.BufferInfo",
              "MediaCodec.BufferInfo"
          )
          source = source.replace(
              "MediaMuxer.BUFFER_FLAG_KEY_FRAME",
              "MediaCodec.BUFFER_FLAG_KEY_FRAME"
          )
          source = source.replace(
              "MediaMuxer\n                        .BUFFER_FLAG_KEY_FRAME",
              "MediaCodec\n                        .BUFFER_FLAG_KEY_FRAME"
          )

          if "MediaCodec.BufferInfo" in source:
              if "import android.media.MediaCodec;" not in source:
                  marker = "import android.media.MediaExtractor;"
                  if marker not in source:
                      raise SystemExit(
                          "Cannot safely add MediaCodec import"
                      )
                  source = source.replace(
                      marker,
                      "import android.media.MediaCodec;\n" + marker,
                      1
                  )

          if "MediaMuxer.BufferInfo" in source:
              raise SystemExit("MediaMuxer.BufferInfo remains after check")

          path.write_text(source, encoding="utf-8")
          print("Java source checks passed.")
          PY

      - name: Configure python-for-android
        shell: bash
        run: |
          set -euxo pipefail

          if grep -q '^p4a.source_dir[[:space:]]*=' buildozer.spec; then
            sed -i '/^p4a.source_dir[[:space:]]*=/d' buildozer.spec
          fi

          sed -i \
            '/^\[app\]/a p4a.source_dir = '"$P4A_SOURCE_DIR" \
            buildozer.spec

          grep -F \
            "p4a.source_dir = $P4A_SOURCE_DIR" \
            buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bilibilidl-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibilidl-build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
