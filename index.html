<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff5f8"><title>bilibilidl</title>
<style>
:root{--pink:#f45d91;--pink2:#fff0f5;--ink:#26232a;--muted:#8c8790;--line:#f1e5ea;--white:#fff;--green:#27a86b;--shadow:0 8px 28px #e9b7c51c}*{box-sizing:border-box}body{margin:0;background:#fffafd;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;font-size:14px}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:84px;background:linear-gradient(180deg,#fff3f7 0,#fffafd 260px)}header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 14px}.brand{font-size:23px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--pink)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.login{border-radius:20px;padding:10px 14px;background:#fff;color:var(--pink);font-weight:700;box-shadow:var(--shadow)}main{padding:4px 15px}.panel{background:#fff;border:1px solid #f8e8ee;border-radius:24px;padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}h2{font-size:16px;margin:0 0 13px}.field{width:100%;border:1px solid var(--line);border-radius:16px;background:#fffafd;padding:15px;outline:none;color:var(--ink)}.field:focus{border-color:#f7a8c4;box-shadow:0 0 0 3px #f45d9114}.primary{width:100%;padding:14px;border-radius:16px;background:var(--pink);color:white;font-weight:800;margin-top:11px;box-shadow:0 7px 16px #f45d9130}.secondary{padding:10px 13px;border-radius:13px;background:var(--pink2);color:#d84278;font-weight:700}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.cover{width:92px;height:62px;object-fit:cover;border-radius:12px;background:#f9e8ee}.video-title{font-weight:800;font-size:15px;line-height:1.45}.chip{display:inline-block;background:var(--pink2);color:#d84278;border-radius:10px;padding:5px 8px;font-size:11px;margin-top:5px}.hide{display:none!important}.options{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.part{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);padding:11px;border-radius:14px;margin-top:8px}.part input{accent-color:var(--pink);margin-top:3px}.part-name{font-weight:650;line-height:1.4}.part small{color:var(--muted)}select{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fffafd;max-width:60%;color:var(--ink)}.progress{height:8px;background:#f8e9ef;border-radius:8px;overflow:hidden;margin:13px 0 8px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#f58cb0,#f45d91);transition:width .25s}.file{padding:12px 0;border-bottom:1px solid #f7edf1}.file:last-child{border:0}.file-name{font-weight:650;word-break:break-all}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center}.tabwrap{width:560px;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:5px}.tab{flex:1;background:transparent;color:#9c9299;padding:8px 4px;border-radius:13px;font-size:12px}.tab b{display:block;font-size:19px;margin-bottom:2px}.tab.active{background:var(--pink2);color:#d84278;font-weight:800}.notice{background:#fff7df;color:#876326;border-radius:12px;padding:10px;font-size:12px;line-height:1.5}.empty{text-align:center;color:var(--muted);padding:22px 8px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff7fa;border-radius:15px;padding:14px}.stat strong{display:block;font-size:19px;margin-bottom:3px}.stat span{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#29242b;color:#fff;border-radius:13px;padding:11px 15px;max-width:90%;z-index:10;display:none}
</style></head>
<body><div class="app">
<header><div><div class="brand">bili<span>bili</span>dl</div><div class="sub">B站视频解析 · 本地下载</div></div><button class="login" id="accountBtn" onclick="showTab('me')">我的账号　›</button></header>
<main>
<section id="homePage">
<div class="panel"><h2>解析视频</h2><input class="field" id="videoUrl" placeholder="粘贴 BV / AV / 视频链接 / b23.tv" autocomplete="off"><button class="primary" id="parseBtn" onclick="parseVideo()">解析视频</button><div class="muted" style="margin-top:10px">支持单个视频与多 P 视频。登录状态与高画质取决于当前已接通的账号模块。</div></div>
<div class="panel hide" id="videoPanel"><div class="row" style="align-items:flex-start"><img id="cover" class="cover" alt="视频封面"><div style="flex:1;min-width:0"><div id="videoTitle" class="video-title"></div><div id="videoOwner" class="muted" style="margin-top:5px"></div><span id="videoMeta" class="chip"></span></div></div>
<div class="row between" style="margin-top:17px"><b>下载清晰度</b><select id="quality"></select></div><div class="row between" style="margin-top:18px"><b>分 P 选择</b><div class="options" style="margin:0"><button class="secondary" onclick="selectAll(true)">全选</button><button class="secondary" onclick="selectAll(false)">清空</button></div></div><div id="parts"></div><button class="primary" onclick="startDownload()">开始下载所选分 P</button><div class="muted" style="margin-top:9px">下载任务由本地 Python 后端执行，离开此页面不会主动取消。</div></div>
<div class="panel" id="taskPanel"><div class="row between"><h2 style="margin:0">下载任务</h2><button class="secondary" onclick="refreshHistory()">刷新列表</button></div><div id="taskList" class="empty">暂无正在显示的任务</div></div>
</section>
<section id="downloadsPage" class="hide"><div class="panel"><div class="row between"><h2 style="margin:0">已下载</h2><button class="secondary" onclick="refreshHistory()">刷新</button></div><div id="historyList" class="empty">正在读取本地文件…</div></div></section>
<section id="mePage" class="hide"><div class="panel"><div class="row"><div style="width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--pink2);color:var(--pink);font-size:24px">♥</div><div><div style="font-weight:800;font-size:17px" id="profileName">B站账号</div><div class="muted" id="profileStatus">正在检查登录状态…</div></div></div></div><div class="panel"><h2>本地统计</h2><div class="statgrid"><div class="stat"><strong id="fileCount">—</strong><span>已下载文件</span></div><div class="stat"><strong id="fileSize">—</strong><span>占用空间</span></div></div></div><div class="panel"><h2>应用信息</h2><div class="row between"><span>应用名称</span><b>bilibilidl</b></div><div class="row between" style="margin-top:13px"><span>界面版本</span><b>HTML Preview</b></div><div class="notice" style="margin-top:14px">此页面负责 HTML 主界面。登录、在线预览、封面导出、弹幕和字幕等功能需对应后端接口实际接通；不会把未实现的按钮伪装成已完成。</div></div></section>
</main></div>
<nav class="tabs"><div class="tabwrap"><button class="tab active" id="tabHome" onclick="showTab('home')"><b>⌂</b>首页</button><button class="tab" id="tabDownloads" onclick="showTab('downloads')"><b>▤</b>已下载</button><button class="tab" id="tabMe" onclick="showTab('me')"><b>♡</b>我的</button></div></nav><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);let parsed=null,currentTask=null,pollHandle=null;
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2800)}
function nativeCall(data){try{if(window.NativeBridge&&typeof NativeBridge.call==='function')return JSON.parse(NativeBridge.call(JSON.stringify(data)));}catch(e){return {ok:false,error:'桥接调用失败：'+e.message}}return {ok:false,error:'当前为浏览器预览模式；请在集成 WebView 的 APK 中使用。'}}
function showTab(tab){['home','downloads','me'].forEach(n=>{ $(n+'Page').classList.toggle('hide',n!==tab);$('tab'+n[0].toUpperCase()+n.slice(1)).classList.toggle('active',n===tab)});if(tab==='downloads')refreshHistory();if(tab==='me')refreshAccount()}
function parseVideo(){const input=$('videoUrl').value.trim();if(!input)return toast('请先粘贴 B 站视频链接');$('parseBtn').disabled=true;$('parseBtn').textContent='解析中…';setTimeout(()=>{const r=nativeCall({action:'parse',url:input});$('parseBtn').disabled=false;$('parseBtn').textContent='解析视频';if(!r.ok)return toast(r.error||'解析失败');parsed=r;$('videoPanel').classList.remove('hide');$('videoTitle').textContent=r.video.title||'未命名视频';$('videoOwner').textContent='UP主：'+(r.video.owner||'未知');$('videoMeta').textContent=(r.pages||[]).length+' 个分P';$('cover').src=r.video.pic||'';const q=$('quality');q.innerHTML='';(r.qualities||[]).forEach((v,i)=>{let o=document.createElement('option');o.value=v.qn;o.textContent=v.label+' ('+v.qn+')';q.appendChild(o)});if(!q.options.length){let o=document.createElement('option');o.value=0;o.textContent='默认清晰度';q.appendChild(o)}const parts=$('parts');parts.innerHTML='';(r.pages||[]).forEach(p=>{const lab=document.createElement('label');lab.className='part';lab.innerHTML=`<input type="checkbox" checked value="${Number(p.page)||1}"><span><span class="part-name">P${Number(p.page)||1}　${esc(p.part||'未命名分P')}</span><br><small>${duration(p.duration)}</small></span>`;parts.appendChild(lab)});toast('解析成功');},0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function duration(n){n=Number(n)||0;return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
function selectAll(v){document.querySelectorAll('#parts input[type=checkbox]').forEach(x=>x.checked=v)}
function startDownload(){if(!parsed)return toast('请先解析视频');const pages=[...document.querySelectorAll('#parts input:checked')].map(x=>Number(x.value));if(!pages.length)return toast('至少选择一个分P');const selected=pages.length===(parsed.pages||[]).length?'all':pages.length===1?pages[0]:'all';if(pages.length>1&&selected==='all'&&pages.length!==(parsed.pages||[]).length)return toast('当前后端仅支持全选或单个分P，请分批下载');const r=nativeCall({action:'start_download',pages:selected,quality:Number($('quality').value)||0});if(!r.ok)return toast(r.error||'无法启动下载');currentTask=r.task_id;$('taskList').innerHTML='下载任务已启动：'+esc(currentTask);toast('下载任务已启动');pollTask()}
function pollTask(){if(pollHandle)clearTimeout(pollHandle);if(!currentTask)return;const r=nativeCall({action:'task_status',task_id:currentTask});if(r.ok&&r.task){const t=r.task;$('taskList').innerHTML=`<div class="row between"><b>${esc(t.message||t.state)}</b><b>${Number(t.progress)||0}%</b></div><div class="progress"><div style="width:${Math.max(0,Math.min(100,Number(t.progress)||0))}%"></div></div><div class="muted">${esc(t.state||'')}</div>${t.error?'<div class="notice">'+esc(t.error)+'</div>':''}${t.state==='running'?'<button class="secondary" onclick="cancelTask()">取消下载</button>':''}`;if(t.state!=='running'){currentTask=null;refreshHistory();return}}pollHandle=setTimeout(pollTask,1200)}function cancelTask(){if(!currentTask)return;const r=nativeCall({action:'cancel_download',task_id:currentTask});toast(r.ok?'已请求取消':'取消失败：'+(r.error||''))}
function refreshHistory(){const r=nativeCall({action:'history'});if(!r.ok){$('historyList').innerHTML='<div class="empty">'+esc(r.error||'无法读取本地下载记录')+'</div>';return}const files=r.files||[];$('historyList').innerHTML=files.length?files.map(f=>`<div class="file"><div class="file-name">${esc(f.name)}</div><div class="muted">${bytes(f.size)} · ${esc(f.path||'')}</div></div>`).join(''):'<div class="empty">还没有下载文件</div>';$('fileCount').textContent=files.length;$('fileSize').textContent=bytes(files.reduce((a,f)=>a+(Number(f.size)||0),0));}
function refreshAccount(){const r=nativeCall({action:'account'});if(!r.ok){$('profileStatus').textContent='无法读取账号状态';return}$('profileName').textContent=r.logged_in?(r.profile?.uname||'已登录账号'):'B站账号';$('profileStatus').textContent=r.logged_in?'已登录 · UID '+(r.profile?.mid||'未知'):'当前未登录';$('accountBtn').textContent=r.logged_in?(r.profile?.uname||'已登录'):'我的账号　›'}function bytes(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
window.addEventListener('load',()=>{const r=nativeCall({action:'ping'});if(!r.ok)toast('预览模式：需要在 APK 内才能调用下载后端');refreshAccount();refreshHistory()});
</script></body></html>
